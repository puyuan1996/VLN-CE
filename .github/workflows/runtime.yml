name: Standalone runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r vlnce_runtime/requirements-test.txt
      - run: ruff check vlnce_runtime
      - run: ruff format --check vlnce_runtime
      - run: python -m pytest -q vlnce_runtime/tests
      - name: Python 3.6 standalone close protocol
        run: |
          docker run --rm -i -v "$PWD:/source:ro" -w /tmp python:3.6-slim \
            python -I -S /source/vlnce_runtime/worker.py \
            --runtime-config /missing/runtime.json --runtime-sha256 unused \
            > /tmp/legacy-close.json <<'JSON'
          {"id":1,"method":"close","params":{}}
          JSON
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/legacy-close.json').read_text()) == {
              'id': 1, 'ok': True, 'result': {}
          }
          PY
